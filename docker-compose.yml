services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shortener
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 15

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 15

  # 3 identical, stateless copies of the app. None of them keeps data of
  # its own (everything lives in Redis/Postgres), so any copy can answer
  # any request, and more copies can be added with one number.
  app:
    build: .
    deploy:
      replicas: 3
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/shortener
      REDIS_URL: redis://redis:6379/0
      BASE_URL: http://localhost:8000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # The only thing exposed to the outside: Nginx on port 8000.
  nginx:
    image: nginx:1.27
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports: ["8000:80"]
    depends_on:
      - app
