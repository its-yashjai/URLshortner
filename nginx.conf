worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Default Docker Compose DNS round-robin isn't sticky and doesn't
    # report backend health, so we declare the replicas explicitly and
    # let Nginx do real round-robin with passive health checks.
    upstream app_backend {
        server app1:8000 max_fails=3 fail_timeout=10s;
        server app2:8000 max_fails=3 fail_timeout=10s;
        server app3:8000 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://app_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Pass through the app's own diagnostic headers unchanged so the
            # frontend can see which replica actually served each request.
            proxy_pass_header X-Served-By;
            proxy_pass_header X-Cache;
        }
    }
}
