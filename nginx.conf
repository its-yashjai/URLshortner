# Load balancer: spreads incoming requests across the app replicas.
# Docker's DNS returns one address per replica for the name "app",
# and Nginx sends requests to them in turn (round-robin).
events {}

http {
    upstream shortener {
        server app:8000;
        keepalive 64;              # reuse connections to the replicas
    }

    server {
        listen 80;

        location / {
            proxy_pass http://shortener;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
