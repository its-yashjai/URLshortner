# Render Blueprint: one click creates the app and a Redis-compatible Key Value
# store, and wires the Redis connection string in.
# The database is a free Neon Postgres (Render's free Postgres expires after
# 30 days, Neon's free plan does not). Paste its connection string as
# DATABASE_URL when Render asks for it during the Blueprint setup.
# Free tier notes: the web service sleeps after 15 min without traffic
# (first request then takes ~1 min), the Neon database sleeps after 5 min idle,
# and free Key Value data is not persisted (fine here: it's only a cache and
# a 2-second click buffer).
services:
  - type: web
    name: url-shortener
    runtime: docker
    plan: free
    branch: v2
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false   # secret: the Neon connection string, set in the dashboard
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: url-shortener-cache
          property: connectionString

  - type: keyvalue
    name: url-shortener-cache
    plan: free
    ipAllowList: []   # only reachable from other Render services
